[project]
name = "wallbox-provider"
version = "0.1.0"
description = "Home-Assistant-Integration, die Wallboxen für SkytechHEMS ansteuert und normalisierte Entities liefert"
readme = "README.md"
requires-python = ">=3.13"
# Laufzeit-Abhängigkeiten der Integration selbst — müssen mit manifest.json "requirements"
# übereinstimmen. Der go-e-Adapter spricht Modbus TCP mit der Standardbibliothek (asyncio).
dependencies = []

[dependency-groups]
# Die Integration importiert Home Assistant auf Modulebene; jeder Test zieht HA mit.
dev = [
    "pytest-homeassistant-custom-component",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
